<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#11213b" />
    <title>夏莱礼物工坊</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=dashboard-20260819-schale-alchemy-workshop-agent-chat-v111" />
    <link rel="stylesheet" href="./agent.css?v=dashboard-20260819-schale-alchemy-workshop-agent-chat-v111&ui=v120" />
    <script src="./js/boot.js?v=dashboard-20260819-schale-alchemy-workshop-agent-chat-v111&ui=v113&knowledge=v3"></script>
  </head>
  <body>
    <div class="app-shell" id="app">
      <div class="loading-state" id="loading-state" role="status" aria-live="polite">
        <span class="loading-mark" aria-hidden="true"><span class="loading-orbit"></span></span>
        <div>
          <strong id="loading-title">正在加载数据</strong>
          <p id="loading-description">学生、礼物、制造数据</p>
        </div>
      </div>
      <div class="error-state" id="error-state" hidden role="alert">
        <strong id="error-title">数据载入失败</strong>
        <p id="error-message">请通过本地 HTTP 服务打开页面。</p>
      </div>
      <main class="dashboard" id="dashboard" hidden>
        <aside class="app-rail" aria-label="工作区导航">
          <div class="rail-brand" aria-label="夏莱礼物工坊">
            <button class="brand-glyph" type="button" data-brand-avatar aria-haspopup="dialog" aria-controls="brand-avatar-dialog" aria-label="品牌头像" title="品牌头像"><span class="brand-avatar-fallback" aria-hidden="true">未</span></button>
            <span class="rail-brand-name">SCHALE</span>
          </div>
          <div id="workbench-nav"></div>
          <div class="rail-note" aria-hidden="true">CN<br><span>LAB</span></div>
        </aside>
        <div class="app-content">
          <header class="dashboard-header">
            <div class="topbar-title">
              <span class="topbar-kicker" id="topbar-kicker">SCHALE / CN</span>
              <h1 id="page-title">制造与好感工具</h1>
            </div>
            <div class="header-meta">
              <span class="status-dot" aria-hidden="true"></span>
              <span id="header-meta-copy">SchaleDB CN · — 学生条目</span>
              <div class="language-switcher" id="language-switcher" role="group" aria-label="语言"></div>
              <span class="header-mark" data-brand-avatar aria-hidden="true"><span class="brand-avatar-fallback" aria-hidden="true">未</span></span>
            </div>
          </header>
          <div class="dashboard-layout">
            <aside class="directory-panel panel" aria-labelledby="directory-title">
              <div class="directory-heading"><div><span class="directory-kicker" id="directory-kicker">学生</span><h2 id="directory-title">学生目录</h2></div><button type="button" class="directory-toggle" id="directory-toggle" aria-controls="student-list" aria-expanded="true">收起</button><span class="directory-count" id="directory-count">—</span></div>
              <label class="search-box"><span class="search-icon" aria-hidden="true">⌕</span><span class="sr-only" id="student-search-label">搜索学生</span><input id="student-search" type="search" placeholder="搜索中文名 / English" autocomplete="off" /></label>
              <div class="student-list" id="student-list" role="listbox" aria-label="学生条目"></div>
            </aside>
            <section class="detail-column" id="detail-column"></section>
          </div>
        </div>
      </main>
      <dialog class="brand-avatar-dialog" id="brand-avatar-dialog" aria-labelledby="brand-avatar-dialog-title">
        <div class="brand-avatar-dialog-head">
          <div><span class="dialog-kicker" id="brand-avatar-dialog-kicker">SCHALE</span><h2 id="brand-avatar-dialog-title">选择品牌头像</h2></div>
          <button class="icon-button" type="button" data-brand-avatar-close aria-label="关闭">×</button>
        </div>
        <label class="brand-avatar-search"><span class="sr-only" id="brand-avatar-search-label">搜索学生</span><input id="brand-avatar-search" type="search" autocomplete="off" placeholder="搜索学生" /></label>
        <div class="brand-avatar-options" id="brand-avatar-options" role="listbox" aria-label="选择品牌头像"></div>
      </dialog>
    </div>
  </body>
</html>
